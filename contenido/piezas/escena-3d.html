<div class="stage" id="stage" aria-hidden="true">
  <div class="stage-fallback">
    <svg viewBox="0 0 800 800" preserveAspectRatio="xMidYMid meet">
      <defs>
        <radialGradient id="fbCore" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#e6f6ff" stop-opacity=".95"/>
          <stop offset=".28" stop-color="#45d6f7" stop-opacity=".55"/>
          <stop offset=".62" stop-color="#1d63f0" stop-opacity=".16"/>
          <stop offset="1" stop-color="#1d63f0" stop-opacity="0"/>
        </radialGradient>
        <pattern id="fbDots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="1.1" fill="#7fd8ff" fill-opacity=".55"/></pattern>
        <clipPath id="fbSphere"><circle cx="400" cy="400" r="150"/></clipPath>
      </defs>
      <circle cx="400" cy="400" r="330" fill="url(#fbCore)" opacity=".55"/>
      <g clip-path="url(#fbSphere)" opacity=".7"><rect x="250" y="250" width="300" height="300" fill="url(#fbDots)"/></g>
      <g fill="none" stroke="#7fb4ff">
        <ellipse cx="400" cy="400" rx="230" ry="78" transform="rotate(-16 400 400)" stroke-opacity=".34"/>
        <ellipse cx="400" cy="400" rx="270" ry="104" transform="rotate(22 400 400)" stroke-opacity=".24"/>
        <ellipse cx="400" cy="400" rx="318" ry="132" transform="rotate(-4 400 400)" stroke-opacity=".16"/>
      </g>
      <circle cx="400" cy="400" r="58" fill="url(#fbCore)"/>
    </svg>
  </div>
  <canvas id="scene"></canvas>
  <div class="stage-shade"></div>
</div>
